[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "witdl"
version = "0.1.0"
description = "Advanced WitAnime downloader with search, multi-hoster support, and library management"
readme = "README.md"
requires-python = ">=3.10"

[project.scripts]
witdl = "witdl.cli:main"

[tool.setuptools.packages.find]
include = ["witdl*"]
