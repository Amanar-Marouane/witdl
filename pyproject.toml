[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "witdl"
version = "0.1.0"
description = "Advanced WitAnime downloader with search, multi-hoster support, and library management"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "WitDL Contributors" },
]
keywords = ["anime", "downloader", "witanime", "cli", "media"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet",
    "Topic :: Multimedia :: Video",
]

[project.urls]
Homepage = "https://github.com/OWNER/witdl"
Documentation = "https://github.com/OWNER/witdl/blob/main/docs/GUIDE.md"
Changelog = "https://github.com/OWNER/witdl/blob/main/CHANGELOG.md"
Issues = "https://github.com/OWNER/witdl/issues"

[project.scripts]
witdl = "witdl.cli:main"

[tool.setuptools.packages.find]
include = ["witdl*"]
